name: Schedule canary

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
    - cron: '55 10,13 * * *'
      timezone: 'Asia/Seoul'

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "event=${{ github.event_name }} cron='${{ github.event.schedule }}'"
          date -u; TZ=Asia/Seoul date
