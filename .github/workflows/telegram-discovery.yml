name: Telegram Discovery Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '20 8,12,18 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

concurrency:
  group: telegram-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Verify Discovery logic
        run: python3 -m unittest discover -s tests -p 'test_telegram_discovery.py' -v
      - name: Collect and discover
        run: python3 scripts/telegram_discovery.py
      - name: Commit Discovery data only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- telegram_discovery
          if git diff --cached --quiet; then
            echo "Discovery data unchanged."
            exit 0
          fi
          git commit -m "data: update Telegram Discovery Scout"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
