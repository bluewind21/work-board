name: Telegram daily collector

on:
  workflow_dispatch:
  schedule:
    - cron: '10 8,11,17 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

concurrency:
  group: telegram-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  telegram-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Collect today's public Telegram posts
        id: collect
        run: python3 scripts/telegram_collect.py

      - name: Save daily JSON in repository
        env:
          OUTPUT_PATH: ${{ steps.collect.outputs.output_path }}
          COLLECTION_DATE: ${{ steps.collect.outputs.collection_date }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_PATH"
          if git diff --cached --quiet -- "$OUTPUT_PATH"; then
            echo "Daily JSON unchanged."
            exit 0
          fi
          git commit -m "data: collect Telegram posts for $COLLECTION_DATE" -- "$OUTPUT_PATH"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
